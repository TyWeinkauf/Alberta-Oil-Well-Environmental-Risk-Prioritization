    kind: file
    publisher: Alberta Energy Regulator
    reference_crs: null  # Must inspect the actual ST37 .prj/metadata.
    reference_license: AER copyright and product-specific information terms; not assumed OGL.
    reference_document: docs/st37_reference.md
    enabled: false
    url: null
    verified: false
    license_note: null
    native_crs: null
    layer_id: null
    field_mapping: {}
  # Official metadata/fields/CRS/educational licence checked 2026-11-10.
  # Full-base 20K layers; explicit codes exclude arbitrary network connectors.
  - key: alberta_water_lakes_rivers
    kind: arcgis
    category: water
    publisher: Government of Alberta
    reference_crs: EPSG:3400
    reference_license: Open Government Licence - Alberta (as described in the supplied reference).
    reference_document: docs/dataset_reference.md
    enabled: true
    url: https://geospatial.alberta.ca/titan/rest/services/environment/base_water_feature/MapServer
    verified: true
    license_note: Open Government Licence - Alberta, as explicitly stated in the layer metadata checked 2026-11-10; Government of Alberta attribution retained.
    license_url: https://open.alberta.ca/licence
    metadata_url: https://geospatial.alberta.ca/titan/rest/services/environment/base_water_feature/MapServer/72
    native_crs: EPSG:3400
    layer_id: 72
    arcgis_where: "FEATURE_TYPE IN ('LAKE-PER','RIV-MAJ','RESERVOIR','CANAL-MAJ','OXBOW-PER')"
    arcgis_preserve_properties: true
    field_mapping: {source_feature_id: OBJECTID, name: NAME, feature_type_code: FEATURE_TYPE}
    coverage_note: Full provincial base waterbody layer queried for study area plus 500 m. Selected perennial lakes/rivers, reservoirs, canals and oxbows; excludes icefields, quarries and dugouts. Scale 1:20,000 does not establish survey accuracy.
  - key: alberta_water_streams
    kind: arcgis
    category: water
    publisher: Government of Alberta
    reference_document: docs/hydrography.md
    enabled: true
    url: https://geospatial.alberta.ca/titan/rest/services/environment/base_water_feature/MapServer
    verified: true
    license_note: Open Government Licence - Alberta, explicitly stated in layer metadata checked 2026-11-10; Government of Alberta attribution retained.
    license_url: https://open.alberta.ca/licence
    metadata_url: https://geospatial.alberta.ca/titan/rest/services/environment/base_water_feature/MapServer/107
    native_crs: EPSG:3400
    layer_id: 107
    arcgis_where: "FEATURE_TYPE IN ('STR-PER','CANAL','OXBOW-PER','DITCH')"
    arcgis_preserve_properties: true
    field_mapping: {source_feature_id: OBJECTID, name: NAME, feature_type_code: FEATURE_TYPE}
    coverage_note: Full provincial base single-line network queried for study area plus 500 m. Selected perennial streams, canals, oxbows and ditches; excludes arbitrary flow connectors. Not an update-only layer or proof of positional accuracy.
